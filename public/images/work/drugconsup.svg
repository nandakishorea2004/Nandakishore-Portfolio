<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Dark Blue Gradient -->
    <linearGradient id="darkBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b365d" />
      <stop offset="100%" stop-color="#1d428a" />
    </linearGradient>

    <!-- Light Blue Gradient -->
    <linearGradient id="lightBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a3e0" />
      <stop offset="100%" stop-color="#0082ca" />
    </linearGradient>
  </defs>

  <g transform="translate(250, 250)">
    <!-- TOP ARROW (Dark Blue) -->
    <path d="M -160,-100 
             C -110,-180 -10,-210 90,-190 
             L 50,-240 
             L 165,-185 
             L 105,-75 
             L 75,-120 
             C 0,-135 -80,-115 -120,-55 
             Z" 
          fill="url(#darkBlueGrad)" />

    <!-- RIGHT ARROW (Dark Blue) -->
    <path d="M 175,-75 
             C 220,-10 215,95 160,170 
             L 215,190 
             L 140,270 
             L 135,150 
             L 175,165 
             C 210,105 210,20 175,-30 
             Z" 
          fill="url(#darkBlueGrad)" />

    <!-- BOTTOM/LEFT ARROW (Light Blue) -->
    <path d="M 75,175 
             C -10,225 -115,200 -170,120 
             L -170,180 
             L -205,55 
             L -85,100 
             L -125,105 
             C -80,160 -5,175 55,140 
             Z" 
          fill="url(#lightBlueGrad)" />

    <!-- CENTER PILL -->
    <g transform="rotate(-45)">
      <!-- Top Half (Light Blue) -->
      <path d="M -30,0 L 30,0 L 30,-50 A 30,30 0 0,0 -30,-50 Z" fill="url(#lightBlueGrad)" />
      <!-- Bottom Half (Dark Blue) -->
      <path d="M -30,10 L 30,10 L 30,60 A 30,30 0 0,1 -30,60 Z" fill="url(#darkBlueGrad)" />
    </g>
  </g>
</svg>
